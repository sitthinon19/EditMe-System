<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EditMe HR Attendance</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Prompt,sans-serif;background:#f4f7fb;color:#163054}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 30px #1232}
.head{background:linear-gradient(135deg,#075fd7,#073a91);color:white;padding:22px}.head small{opacity:.8}.head h2{margin:4px 0}.tabs{display:grid;grid-template-columns:repeat(5,1fr);position:sticky;bottom:0;background:white;border-top:1px solid #e6edf6}
.tabs button{border:0;background:white;padding:12px 3px;font:11px Prompt;color:#64758d}.tabs button.active{color:#0864db;font-weight:700}.page{display:none;padding:20px}.page.active{display:block}.clock{text-align:center;font-size:44px;font-weight:700;color:#0864db;margin:18px 0}.muted{color:#75859b;font-size:13px}
.btn{width:100%;border:0;border-radius:13px;padding:14px;margin:6px 0;background:#0869e8;color:white;font:600 15px Prompt}.btn.out{background:#263d60}.btn.orange{background:#ff7a00}.btn.red{background:#e5484d}.btn.green{background:#10a85b}.btn:disabled{opacity:.45}
.card{border:1px solid #e3eaf4;border-radius:16px;padding:16px;margin:10px 0;background:#fff}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
label{font-size:13px;font-weight:500;display:block;margin:12px 0 5px}input,textarea{width:100%;border:1px solid #d8e1ee;border-radius:11px;padding:12px;font:14px Prompt}textarea{min-height:90px}
.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#e9f2ff;color:#0759c7;font-size:11px}.gps{background:#eaf8ef;color:#18864a;padding:10px;border-radius:12px;text-align:center;margin:12px 0}
.item{border-bottom:1px solid #edf1f6;padding:12px 0}.item:last-child{border:0}.approval-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.error{background:#fff0f0;color:#b42318;padding:12px;border-radius:10px;margin:10px 0}.ok{background:#eaf8ef;color:#167744;padding:12px;border-radius:10px;margin:10px 0}
.loading{position:fixed;inset:0;background:#ffffffdd;display:grid;place-items:center;z-index:50}.hidden{display:none!important}
</style></head><body>
<div id="loading" class="loading">กำลังเปิดระบบ...</div>
<div class="app">
 <div class="head"><small id="company">EditMe HR Attendance</small><h2 id="hello">สวัสดี</h2><div id="emp" class="muted" style="color:#dce9ff"></div></div>
 <main>
  <section id="home" class="page active">
   <div class="clock" id="clock">--:--:--</div><div id="gps" class="gps">กำลังตรวจสอบตำแหน่ง...</div>
   <button class="btn" onclick="attendance('IN')">Check In</button><button class="btn out" onclick="attendance('OUT')">Check Out</button>
   <div class="card"><b>วันนี้</b><div id="today" class="muted">ยังไม่มีรายการ</div></div>
  </section>
  <section id="ot" class="page">
   <h3>Request OT</h3><label>วันที่ทำ OT</label><input id="otDate" type="date">
   <div class="row"><div style="flex:1"><label>เวลาเริ่ม</label><input id="startTime" type="time"></div><div style="flex:1"><label>เวลาสิ้นสุด</label><input id="endTime" type="time"></div></div>
   <label>เหตุผล</label><textarea id="reason" placeholder="ระบุเหตุผลในการทำ OT"></textarea>
   <button class="btn orange" onclick="sendOT()">ส่งคำขอ OT</button><div id="otMsg"></div>
  </section>
  <section id="history" class="page"><h3>ประวัติลงเวลา</h3><div id="historyList"></div></section>
  <section id="myot" class="page"><h3>คำขอ OT ของฉัน</h3><div id="myOTList"></div></section>
  <section id="approve" class="page"><h3>รายการรออนุมัติ</h3><div id="approvalList"></div></section>
 </main>
 <div class="tabs">
  <button class="active" onclick="showPage('home',this)">หน้าหลัก</button><button onclick="showPage('ot',this)">ขอ OT</button>
  <button onclick="showPage('history',this)">ลงเวลา</button><button onclick="showPage('myot',this)">OT ของฉัน</button><button onclick="showPage('approve',this)">อนุมัติ</button>
 </div>
</div>
<script>
let UID='', pos=null, CONFIG={};
const $=id=>document.getElementById(id);
function gas(fn,...args){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e.message||e)))[fn](...args))}
function msg(el,text,ok=true){$(el).innerHTML=`<div class="${ok?'ok':'error'}">${text}</div>`}
async function init(){
 try{
  CONFIG=await gas('publicConfig'); $('company').textContent=CONFIG.companyName;
  if(!CONFIG.liffId || CONFIG.liffId.includes('PUT_')) throw new Error('กรุณาตั้งค่า LIFF_ID ในชีต Settings ก่อน');
  await liff.init({liffId:CONFIG.liffId});
  if(!liff.isLoggedIn()){liff.login();return}
  const p=await liff.getProfile(); UID=p.userId;
  const d=await gas('getDashboard',UID);
  $('hello').textContent='สวัสดี '+d.employee.name; $('emp').textContent=`${d.employee.empId} • ${d.employee.department||''} • ${d.employee.position||''}`;
  renderToday(d.todayAttendance); getGPS(); setDefaults();
 }catch(e){document.querySelector('.app').innerHTML=`<div class="page active"><div class="error"><b>เปิดระบบไม่สำเร็จ</b><br>${e.message}</div></div>`}
 finally{$('loading')?.classList.add('hidden')}
}
function getGPS(){
 if(!navigator.geolocation){$('gps').textContent='อุปกรณ์ไม่รองรับ GPS';return}
 navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};$('gps').textContent='✓ พร้อมตรวจสอบตำแหน่ง GPS'},e=>{$('gps').textContent='กรุณาอนุญาตการเข้าถึงตำแหน่ง'}, {enableHighAccuracy:true,timeout:12000,maximumAge:10000});
}
async function attendance(type){
 try{if(!pos) throw new Error('ยังไม่พบตำแหน่ง GPS กรุณาเปิด Location');$('loading').classList.remove('hidden');
  const r=await gas('submitAttendance',{uid:UID,type,lat:pos.lat,lng:pos.lng});
  alert(`${r.message}\n${r.time}\n${r.location} • ${r.distance} เมตร`); const d=await gas('getDashboard',UID);renderToday(d.todayAttendance);
 }catch(e){alert(e.message)}finally{$('loading').classList.add('hidden')}
}
function renderToday(a){$('today').innerHTML=a.length?a.map(x=>`<div class="item"><b>${x.TYPE==='IN'?'Check In':'Check Out'}</b> • ${Math.round(x.DISTANCE_M)} เมตร <span class="status">${x.STATUS}</span></div>`).join(''):'ยังไม่มีรายการวันนี้'}
function setDefaults(){const d=new Date();$('otDate').value=d.toISOString().slice(0,10);$('startTime').value='18:00';$('endTime').value='21:00'}
async function sendOT(){try{const r=await gas('requestOT',{uid:UID,otDate:$('otDate').value,startTime:$('startTime').value,endTime:$('endTime').value,reason:$('reason').value});msg('otMsg',r.message)}catch(e){msg('otMsg',e.message,false)}}
async function showPage(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='history')loadHistory();if(id==='myot')loadMyOT();if(id==='approve')loadApprovals()}
async function loadHistory(){try{const a=await gas('getAttendanceHistory',UID);$('historyList').innerHTML=a.length?a.map(x=>`<div class="item"><div class="row"><b>${x.type==='IN'?'Check In':'Check Out'}</b><span class="status">${x.distance} m</span></div><div class="muted">${x.time} • ${x.location}</div></div>`).join(''):'ไม่มีข้อมูล'}catch(e){$('historyList').innerHTML=e.message}}
async function loadMyOT(){try{const a=await gas('getMyOT',UID);$('myOTList').innerHTML=a.length?a.map(x=>`<div class="card"><div class="row"><b>${x.OT_DATE}</b><span class="status">${x.STATUS}</span></div><div>${x.START_TIME} - ${x.END_TIME} (${x.HOURS} ชม.)</div><div class="muted">${x.REASON||''}</div></div>`).join(''):'ไม่มีรายการ'}catch(e){$('myOTList').innerHTML=e.message}}
async function loadApprovals(){try{const a=await gas('getPendingApprovals',UID);$('approvalList').innerHTML=a.length?a.map(x=>`<div class="card"><div class="row"><b>${x.empId}</b><span class="status">Level ${x.level}</span></div><div>${x.date} • ${x.start}-${x.end} • ${x.hours} ชม.</div><p class="muted">${x.reason||'-'}</p><input id="n_${x.otId}" placeholder="หมายเหตุ (ถ้ามี)"><div class="approval-actions"><button class="btn green" onclick="act('${x.otId}','APPROVE')">อนุมัติ</button><button class="btn red" onclick="act('${x.otId}','REJECT')">ไม่อนุมัติ</button></div></div>`).join(''):'ไม่มีรายการรออนุมัติ'}catch(e){$('approvalList').innerHTML=e.message}}
async function act(id,action){if(!confirm(action==='APPROVE'?'ยืนยันการอนุมัติ?':'ยืนยันไม่อนุมัติ?'))return;try{const r=await gas('approveOT',{uid:UID,otId:id,action,note:$('n_'+id).value});alert(r.message);loadApprovals()}catch(e){alert(e.message)}}
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('th-TH',{hour12:false})},1000);init();
</script></body></html>
